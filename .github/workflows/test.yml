name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Matches the consuming backend's Ruby.
          ruby-version: '3.0.4'
          bundler-cache: true
      - run: bundle exec rspec
